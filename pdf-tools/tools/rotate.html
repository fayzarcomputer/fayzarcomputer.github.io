<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>রোটেট পিডিএফ — Fayzar Computer</title>
  <link rel="stylesheet" href="../css/pdf-tools.css">
  <style>@font-face{font-family:'NotoSansBengali';src:url('../fonts/bangla/NotoSansBengali.ttf');}@font-face{font-family:'SutonnyMJ';src:url('../fonts/bangla/SutonnyMJ-Regular.ttf');}</style>
</head>
<body>
<div class="pdf-bg-canvas"></div>
<nav class="pdf-nav">
  <a href="../index.html" class="nav-back">← টুলস হোম</a>
  <span style="border-left:1px solid rgba(255,255,255,0.1);margin:0 0.5rem;height:20px;"></span>
  <span style="font-family:'NotoSansBengali',sans-serif;font-weight:700;">🔄 রোটেট পিডিএফ</span>
  <div class="spacer"></div>
  <button onclick="toggleTheme()" class="btn btn-outline btn-sm" id="themeBtn">🌙</button>
</nav>
<div class="tool-page">
  <div class="tool-page-header">
    <div class="tool-page-icon" style="background:linear-gradient(135deg,#06b6d4,#0891b2);">🔄</div>
    <div><h1>রোটেট পিডিএফ</h1><p>পিডিএফের পেজ ঘোরান</p></div>
  </div>

  <div class="panel">
    <label class="upload-zone" for="fileIn" id="dropZone">
      <div class="upload-icon">🔄</div><h3>পিডিএফ ফাইল নির্বাচন করুন</h3>
      <p>ড্র্যাগ ও ড্রপ অথবা ক্লিক করুন</p>
      <input type="file" id="fileIn" accept=".pdf">
    </label>
  </div>
  <div class="panel" id="settingsPanel" style="display:none;">
    <h3>🔄 রোটেশন সেটিং</h3>
    <div class="form-group"><label>কোন পেজ ঘোরাবেন?</label>
      <select class="form-control" id="pageTarget" onchange="updatePageTarget()">
        <option value="all">সব পেজ</option>
        <option value="odd">বিজোড় পেজ (1,3,5...)</option>
        <option value="even">জোড় পেজ (2,4,6...)</option>
        <option value="custom">নির্দিষ্ট পেজ</option>
      </select>
    </div>
    <div id="customPages" style="display:none;" class="form-group">
      <label>পেজ নম্বর (কমা দিয়ে, যেমন: 1,3,5)</label>
      <input type="text" class="form-control" id="pageNums" placeholder="1, 3, 7">
    </div>
    <div class="form-group"><label>রোটেশন ডিগ্রি</label>
      <div style="display:flex;gap:0.5rem;">
        <button class="btn btn-outline" id="rot90" onclick="setRot(90)" style="flex:1;">↩️ 90°</button>
        <button class="btn btn-primary" id="rot180" onclick="setRot(180)" style="flex:1;">🔁 180°</button>
        <button class="btn btn-outline" id="rot270" onclick="setRot(270)" style="flex:1;">↪️ 270°</button>
      </div>
    </div>
    <div style="font-family:'NotoSansBengali',sans-serif;font-size:0.85rem;color:#94a3b8;" id="fileInfo"></div>
    <button class="btn btn-primary" onclick="rotatePDF()" style="width:100%;justify-content:center;margin-top:0.75rem;">🔄 রোটেট করুন</button>
  </div>
  <script>
    var pdfFile=null,rotation=180;
    document.addEventListener('DOMContentLoaded',function(){initTheme();setupDropZone('dropZone','fileIn',function(f){loadFile(f[0]);});});
    function updatePageTarget(){document.getElementById('customPages').style.display=document.getElementById('pageTarget').value==='custom'?'block':'none';}
    async function loadFile(f){pdfFile=f;var doc=await PDFLib.PDFDocument.load(await readFileAsArrayBuffer(f),{ignoreEncryption:true});document.getElementById('fileInfo').textContent=f.name+' — '+doc.getPageCount()+' পেজ';document.getElementById('settingsPanel').style.display='block';}
    function setRot(r){rotation=r;['rot90','rot180','rot270'].forEach(function(id){document.getElementById(id).className='btn btn-outline';});document.getElementById('rot'+r).className='btn btn-primary';}
    async function rotatePDF(){if(!pdfFile)return;showProgress('রোটেট হচ্ছে...',30);
      try{var doc=await PDFLib.PDFDocument.load(await readFileAsArrayBuffer(pdfFile),{ignoreEncryption:true});var total=doc.getPageCount();var target=document.getElementById('pageTarget').value;
        doc.getPages().forEach(function(page,i){var pNum=i+1;var doRotate=false;if(target==='all')doRotate=true;else if(target==='odd')doRotate=pNum%2===1;else if(target==='even')doRotate=pNum%2===0;else{var nums=document.getElementById('pageNums').value.split(',').map(function(n){return parseInt(n.trim());});doRotate=nums.indexOf(pNum)>=0;}
          if(doRotate){var cur=page.getRotation().angle;page.setRotation(PDFLib.degrees((cur+rotation)%360));}});
        var bytes=await doc.save();downloadBlob(new Blob([bytes],{type:'application/pdf'}),'rotated_'+pdfFile.name);hideProgress();toast('✅ রোটেশন সম্পন্ন','success');}
      catch(e){hideProgress();toast('❌ '+e.message,'error');}}
  </script>

</div>
<div id="toast-container"></div>
<div id="progressModal" style="display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.7);align-items:center;justify-content:center;">
  <div class="panel" style="width:320px;text-align:center;"><div id="progressMsg" style="font-family:'NotoSansBengali',sans-serif;margin-bottom:1rem;">প্রসেস হচ্ছে...</div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label"><span id="progressPct">0%</span></div></div>
</div>
<script src="../libs/pdf-lib.min.js"></script>
<script src="../js/pdf-utils.js"></script>
</body>
</html>
