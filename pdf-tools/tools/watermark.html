<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>পিডিএফ ওয়াটারমার্ক — Fayzar Computer</title>
  <link rel="stylesheet" href="../css/pdf-tools.css">
  <style>@font-face{font-family:'NotoSansBengali';src:url('../fonts/bangla/NotoSansBengali.ttf');}@font-face{font-family:'SutonnyMJ';src:url('../fonts/bangla/SutonnyMJ-Regular.ttf');}</style>
</head>
<body>
<div class="pdf-bg-canvas"></div>
<nav class="pdf-nav">
  <a href="../index.html" class="nav-back">← টুলস হোম</a>
  <span style="border-left:1px solid rgba(255,255,255,0.1);margin:0 0.5rem;height:20px;"></span>
  <span style="font-family:'NotoSansBengali',sans-serif;font-weight:700;">💧 পিডিএফ ওয়াটারমার্ক</span>
  <div class="spacer"></div>
  <button onclick="toggleTheme()" class="btn btn-outline btn-sm" id="themeBtn">🌙</button>
</nav>
<div class="tool-page">
  <div class="tool-page-header">
    <div class="tool-page-icon" style="background:linear-gradient(135deg,#a78bfa,#8b5cf6);">💧</div>
    <div><h1>পিডিএফ ওয়াটারমার্ক</h1><p>পিডিএফে টেক্সট ওয়াটারমার্ক যোগ করুন</p></div>
  </div>

  <div class="panel">
    <label class="upload-zone" for="fileIn" id="dropZone">
      <div class="upload-icon">💧</div><h3>পিডিএফ ফাইল নির্বাচন করুন</h3>
      <p>ড্র্যাগ ও ড্রপ অথবা ক্লিক করুন</p>
      <input type="file" id="fileIn" accept=".pdf">
    </label>
  </div>
  <div class="panel" id="settingsPanel" style="display:none;">
    <h3>💧 ওয়াটারমার্ক সেটিং</h3>
    <div class="form-group"><label>ওয়াটারমার্ক টেক্সট</label><input type="text" class="form-control" id="wmText" value="FAYZAR COMPUTER"></div>
    <div class="form-group"><label>ফন্ট সাইজ</label><input type="number" class="form-control" id="wmSize" value="48" min="10" max="200"></div>
    <div class="form-group"><label>রঙ</label><input type="color" class="form-control" id="wmColor" value="#FF0000" style="height:40px;cursor:pointer;"></div>
    <div class="range-group">
      <label style="display:flex;justify-content:space-between;">স্বচ্ছতা <span id="opVal">30</span>%</label>
      <input type="range" id="wmOpacity" min="5" max="100" value="30" oninput="document.getElementById('opVal').textContent=this.value">
    </div>
    <div class="form-group" style="margin-top:0.75rem;"><label>অবস্থান</label>
      <select class="form-control" id="wmPos">
        <option value="center">কেন্দ্র (diagonal)</option>
        <option value="top">উপর-মধ্য</option>
        <option value="bottom">নিচ-মধ্য</option>
      </select>
    </div>
    <button class="btn btn-primary" onclick="addWatermark()" style="width:100%;justify-content:center;margin-top:0.75rem;">💧 ওয়াটারমার্ক যোগ করুন</button>
  </div>
  <script>
    var pdfFile=null;
    document.addEventListener('DOMContentLoaded',function(){initTheme();setupDropZone('dropZone','fileIn',function(f){loadFile(f[0]);});});
    function loadFile(f){pdfFile=f;document.getElementById('settingsPanel').style.display='block';toast('✅ '+f.name,'success');}
    function hexToRgb(hex){return{r:parseInt(hex.slice(1,3),16)/255,g:parseInt(hex.slice(3,5),16)/255,b:parseInt(hex.slice(5,7),16)/255};}
    async function addWatermark(){if(!pdfFile)return;showProgress('ওয়াটারমার্ক যোগ হচ্ছে...',20);
      try{var doc=await PDFLib.PDFDocument.load(await readFileAsArrayBuffer(pdfFile),{ignoreEncryption:true});var font=await doc.embedFont(PDFLib.StandardFonts.Helvetica);
        var text=document.getElementById('wmText').value||'WATERMARK';var size=parseInt(document.getElementById('wmSize').value);var opacity=parseInt(document.getElementById('wmOpacity').value)/100;var col=hexToRgb(document.getElementById('wmColor').value);var pos=document.getElementById('wmPos').value;
        doc.getPages().forEach(function(page){var w=page.getSize().width;var h=page.getSize().height;var tw=font.widthOfTextAtSize(text,size);var x,y,rot=0;
          if(pos==='center'){x=(w-tw)/2;y=(h-size)/2;rot=45;}else if(pos==='top'){x=(w-tw)/2;y=h-size-20;}else{x=(w-tw)/2;y=20;}
          page.drawText(text,{x:x,y:y,size:size,font:font,color:PDFLib.rgb(col.r,col.g,col.b),opacity:opacity,rotate:PDFLib.degrees(rot)});});
        var bytes=await doc.save();downloadBlob(new Blob([bytes],{type:'application/pdf'}),'watermarked_'+pdfFile.name);hideProgress();toast('✅ ওয়াটারমার্ক যোগ হয়েছে','success');}
      catch(e){hideProgress();toast('❌ '+e.message,'error');}}
  </script>

</div>
<div id="toast-container"></div>
<div id="progressModal" style="display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.7);align-items:center;justify-content:center;">
  <div class="panel" style="width:320px;text-align:center;"><div id="progressMsg" style="font-family:'NotoSansBengali',sans-serif;margin-bottom:1rem;">প্রসেস হচ্ছে...</div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label"><span id="progressPct">0%</span></div></div>
</div>
<script src="../libs/pdf-lib.min.js"></script>
<script src="../js/pdf-utils.js"></script>
</body>
</html>
